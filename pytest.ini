[pytest]
testpaths = tests synology_ss/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Always collect coverage so a --cov-fail-under check (per package: see
# scripts/test.sh and .github/workflows/ci.yml) has data to check, even on
# a filtered run. --cov-fail-under itself is NOT set here: a filtered run
# (`scripts/test.sh -k foo`) only exercises a slice of the code, so a total
# enforced here would fail it regardless of whether the selected tests pass.
addopts =
    --cov=custom_components/surveillance_station
    --cov=synology_ss/src/synology_ss_playback
    --cov-report=term-missing
