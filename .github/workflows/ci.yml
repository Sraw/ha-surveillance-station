name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, as hacs/action below: both track a branch, and a push there would change CI unseen.
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  cards:
    name: cards (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # No npm install: the cards and their tests have no dependencies.
      - run: for f in custom_components/surveillance_station/frontend/*.js; do node --check "$f"; done
      - run: node --test "tests/js/*.test.mjs"

  test:
    name: pytest (Python 3.14)
    runs-on: ubuntu-latest
    # Same idea as scripts/test.sh's container cap: die on our own terms
    # rather than run away on the runner.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: python -m pytest -p no:cacheprovider
        env:
          # The library is used from its source tree, same as scripts/test.sh.
          PYTHONPATH: ${{ github.workspace }}/synology_ss/src
          PYTHONDONTWRITEBYTECODE: "1"
      # Per-package gate (not a single pooled --cov-fail-under): each of
      # custom_components/surveillance_station and
      # synology_ss/src/synology_ss_playback must clear 95% on its own.
      - run: coverage report --include='custom_components/surveillance_station/*' --fail-under=95
      - run: coverage report --include='synology_ss/src/synology_ss_playback/*' --fail-under=95
