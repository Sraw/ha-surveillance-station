[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synology-ss-playback"
version = "0.4.0"
description = "Async client for playing back Synology Surveillance Station recordings as HLS"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["aiohttp>=3.11"]
classifiers = [
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[tool.setuptools.package-data]
synology_ss_playback = ["py.typed"]
