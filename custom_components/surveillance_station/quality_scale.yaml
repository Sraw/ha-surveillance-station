# Self-assessment against the HA integration quality scale. This integration
# is mostly HLS views, WebSocket commands and a Lovelace card; its only
# entities are the mute switches (one device), and its only actions mute and
# unmute notifications.
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: Nothing is polled; every NAS call answers a card request.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: todo
    comment: synology-ss-playback is built from this repo, not yet on PyPI.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: No conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: No triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: No options flow; the card options are in the README.
  docs-installation-parameters: done
  entity-unavailable:
    status: exempt
    comment: The switches show local rules, not the NAS's state.
  integration-owner:
    status: todo
    comment: codeowners is set once the repository is published.
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: 86 % (2026-09-25); the fetch-cancellation and cache-eviction paths lack tests.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: No discovery; the NAS is identified by its serial.
  discovery:
    status: exempt
    comment: DSM's SSDP/zeroconf discovery belongs to the core synology_dsm integration.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: No devices.
  entity-category:
    status: exempt
    comment: The switches are controls, with no category.
  entity-device-class:
    status: exempt
    comment: Plain switches.
  entity-disabled-by-default:
    status: exempt
    comment: Four switches and one per camera, each one wanted.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: Nothing the user can repair beyond reauth.
  stale-devices:
    status: exempt
    comment: One device per entry, removed with it.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
