# Self-assessment against the HA integration quality scale. This integration
# is mostly HLS views, WebSocket commands and a Lovelace card; its
# entities are the mute switches, a detection event and a "muted until" sensor per
# camera (one device each, under the entry's), and its only actions mute and
# unmute notifications.
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: >-
      No entity polls (the switches show local rules). The NAS is called for
      the cards and Frigate's reviews, and while it is down to see whether it
      is back: the Frigate bridge each minute while bookmarks fail, the mute
      switches (to find the cameras) after 1, 2, 4, 8, then every 10 minutes.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: No conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: No triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: No options flow; the card options are in the README.
  docs-installation-parameters: done
  entity-unavailable:
    status: exempt
    comment: The switches show local rules, not the NAS's state.
  integration-owner:
    status: todo
    comment: codeowners is set once the repository is published.
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: No discovery; the NAS is identified by its serial.
  discovery:
    status: exempt
    comment: DSM's SSDP/zeroconf discovery belongs to the core synology_dsm integration.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: >-
      A camera SS lists later gets its device and entities then, and one
      missing from two listings half an hour apart loses them.
  entity-category:
    status: exempt
    comment: The switches are controls, with no category.
  entity-device-class:
    status: done
    comment: Switches, an event (motion) and a timestamp sensor, each with the class it has.
  entity-disabled-by-default:
    status: exempt
    comment: >-
      Four switches, and four per camera (all kinds, and each kind): the mute
      card lays them all out as one hierarchy, so each one is wanted.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: Nothing the user can repair beyond reauth.
  stale-devices:
    status: done
    comment: A camera SS stops listing loses its device (see dynamic-devices), or the user removes it.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
